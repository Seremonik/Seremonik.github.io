<button id="newsletter-trigger" style="
  background: none;
  border: 1px solid rgba(249, 115, 22, 0.5);
  color: rgb(249, 115, 22);
  padding: 0.35rem 0.85rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
" onmouseover="this.style.background='rgb(249,115,22)';this.style.color='#fff'"
   onmouseout="this.style.background='none';this.style.color='rgb(249,115,22)'">
  Newsletter
</button>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const nav = document.querySelector("#site-footer nav ul");
    const btn = document.getElementById("newsletter-trigger");
    if (nav && btn) {
      const li = document.createElement("li");
      li.className = "flex mb-1 text-end sm:mb-0 sm:me-7 sm:last:me-0";
      li.appendChild(btn);
      nav.appendChild(li);
    }
  });
</script>
